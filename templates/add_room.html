<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Room - Hostel Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark px-4 custom-navbar">
        <a class="navbar-brand fw-bold" href="/">
            <i class="fa-solid fa-building-user me-2"></i>Hostel Management System
        </a>
        <div class="ms-auto">
            <a href="/rooms" class="btn btn-outline-light btn-sm rounded-pill me-2">
                <i class="fa-solid fa-door-open me-1"></i>View Rooms
            </a>
            <a href="/logout" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">
                            <i class="fa-solid fa-door-closed me-2"></i>Add New Room
                        </h3>

                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Room Number</label>
                                <input type="text" class="form-control" name="room_number" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Capacity</label>
                                <input type="number" class="form-control" name="capacity" min="1" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Room Type</label>
                                <select class="form-select" name="room_type" required>
                                    <option value="Single">Single</option>
                                    <option value="Double">Double</option>
                                    <option value="Shared">Shared</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill">
                                <i class="fa-solid fa-plus me-2"></i>Add Room
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
