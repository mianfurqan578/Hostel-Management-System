<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Hostel Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark px-4 custom-navbar">
        <a class="navbar-brand fw-bold" href="/dashboard">
            <i class="fa-solid fa-building-user me-2"></i>Hostel Management System
        </a>
        <div class="ms-auto">
            <a href="/students" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="fa-solid fa-arrow-left me-1"></i>Back to Students
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">
                            <i class="fa-solid fa-user-pen me-2"></i>Edit Student
                        </h3>

                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" name="full_name" value="{{ student.full_name }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Father Name</label>
                                <input type="text" class="form-control" name="father_name" value="{{ student.father_name }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">CNIC</label>
                                <input type="text" class="form-control" name="cnic" value="{{ student.cnic }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" name="phone" value="{{ student.phone }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" class="form-control" name="address" value="{{ student.address }}">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill">
                                <i class="fa-solid fa-save me-2"></i>Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
