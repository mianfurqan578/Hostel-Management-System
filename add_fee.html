<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fee - Hostel Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.ucom/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark px-4 custom-navbar">
        <a class="navbar-brand fw-bold" href="/">
            <i class="fa-solid fa-building-user me-2"></i>Hostel Management System
        </a>
        <div class="ms-auto">
            <a href="/fees" class="btn btn-outline-light btn-sm rounded-pill me-2">
                <i class="fa-solid fa-money-bill-wave me-1"></i>View Fees
            </a>
            <a href="/logout" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">
                            <i class="fa-solid fa-money-bill-wave me-2"></i>Add Fee Record
                        </h3>

                        {% if students|length == 0 %}
                            <p class="text-center text-muted">No students found. Please add a student first.</p>
                        {% else %}
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Select Student</label>
                                <select class="form-select" name="student_id" required>
                                    {% for student in students %}
                                    <option value="{{ student.student_id }}">{{ student.full_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Amount (Rs.)</label>
                                <input type="number" class="form-control" name="amount" min="0" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Month</label>
                                <select class="form-select" name="month" required>
                                    <option value="January">January</option>
                                    <option value="February">February</option>
                                    <option value="March">March</option>
                                    <option value="April">April</option>
                                    <option value="May">May</option>
                                    <option value="June">June</option>
                                    <option value="July">July</option>
                                    <option value="August">August</option>
                                    <option value="September">September</option>
                                    <option value="October">October</option>
                                    <option value="November">November</option>
                                    <option value="December">December</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill">
                                <i class="fa-solid fa-plus me-2"></i>Add Fee Record
                            </button>
                        </form>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
