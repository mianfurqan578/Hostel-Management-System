<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hostel Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="login-wrapper d-flex align-items-center justify-content-center">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>

        <div class="login-card p-5">
            <div class="text-center mb-4">
                <div class="login-icon mb-3">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Admin Login</h3>
                <p class="text-light opacity-75">Hostel Management System</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-light">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-light text-light">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control custom-input" name="username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-light text-light">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" class="form-control custom-input" name="password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-light w-100 py-2 fw-bold rounded-pill">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                </button>
            </form>

            <p class="text-center text-light opacity-50 mt-4 mb-0" style="font-size: 0.85rem;">
                &copy; 2026 Hostel Management System
            </p>
        </div>
    </div>

</body>
</html>
